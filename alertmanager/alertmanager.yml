global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  group_by:
    - job
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram

  routes:
    - matchers:
        - severity="critical"
      receiver: telegram
      group_wait: 10s

    - matchers:
        - severity="warning"
      receiver: telegram
      group_wait: 30s

inhibit_rules:
  - name: instance-down-suppresses-warning
    source_matchers:
      - alertname="InstanceDown"
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - job
      - instance

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/bot_token
        chat_id_file: /etc/alertmanager/secrets/chat_id
        send_resolved: true
        parse_mode: Markdown
        message: '{{ template "telegram.message" . }}'
