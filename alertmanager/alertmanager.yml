global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/bot_token
        chat_id_file: /etc/alertmanager/secrets/chat_id
        send_resolved: true
        message: |
          [{{ .Status }}] Infrastructure alert

          {{ range .Alerts -}}
          Alert: {{ .Labels.alertname }}
          Job: {{ .Labels.job }}
          Instance: {{ .Labels.instance }}
          Severity: {{ .Labels.severity }}
          Summary: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}

          {{ end }}
